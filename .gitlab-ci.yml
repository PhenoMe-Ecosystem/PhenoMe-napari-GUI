# Runs the tox suite on every push. See tox.ini for what each environment does.
stages:
  - test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # A branch that already has an open merge request is covered by the merge
    # request pipeline, so skip the duplicate branch pipeline.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # external/PhenoMe is a submodule and a uv workspace member; without it
  # `uv sync` cannot resolve the phenome dependency.
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: "1"
  # setuptools_scm still writes src/phenome_gui/_version.py off the git history,
  # which a shallow clone would leave it guessing at.
  GIT_DEPTH: "0"
  # The cache has to live inside the project directory for GitLab to pick it up.
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.tox:
  stage: test
  interruptible: true
  timeout: 1h
  before_script:
    # git: for the submodule, and for uv fetching the stedfm git dependency.
    # The rest: the Qt runtime libraries PyQt6 links against even under the
    # offscreen platform tests/conftest.py selects.
    - apt-get update
    - >
      apt-get install -y --no-install-recommends
      git libgl1 libegl1 libopengl0 libglib2.0-0 libxkbcommon0 libdbus-1-3
      libfontconfig1 libfreetype6
    - rm -rf /var/lib/apt/lists/*
    - pip install --no-cache-dir "tox>=4.28" "tox-uv>=1.36"
  script:
    - tox -e "$TOXENV"
  after_script:
    - uv cache prune --ci || true
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  coverage: '/TOTAL.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'

# The version developed against, so every push is checked against it. The other
# two are held back: stedfm pulls torch and its CUDA packages, which is several
# GB per cold environment.
test:py314:
  extends: .tox
  image: python:3.14-slim-bookworm
  variables:
    TOXENV: py314-linux

test:py313:
  extends: .tox
  image: python:3.13-slim-bookworm
  variables:
    TOXENV: py313-linux
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true

test:py312:
  extends: .tox
  image: python:3.12-slim-bookworm
  variables:
    TOXENV: py312-linux
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - when: manual
      allow_failure: true
