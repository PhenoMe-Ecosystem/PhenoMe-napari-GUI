# Release flow:
#   1. Bump the version by hand:  uv version --bump patch|minor|major
#   2. Commit pyproject.toml and push.
#   3. Tag that commit: git tag v$(uv version --short) && git push origin --tags
#
# The pipeline runs only for vX.Y.Z tags. It checks that the tag matches
# pyproject.toml, then creates the GitLab release.

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

stages:
  - check
  - release


check-version:
  stage: check
  image: ghcr.io/astral-sh/uv:python3.14-trixie

  script:
    - VERSION=$(uv version --short)
    - |
      if [ "v$VERSION" != "$CI_COMMIT_TAG" ]; then
        echo "ERROR: tag $CI_COMMIT_TAG does not match pyproject.toml version $VERSION (expected v$VERSION)"
        exit 1
      fi
    - 'echo "Version check passed: $VERSION"'


release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest

  needs:
    - check-version

  script:
    - echo "Creating release $CI_COMMIT_TAG"

  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "$CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
