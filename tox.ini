# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{312,313,314}-{linux,macos,windows}
isolated_build=true

[testenv]
# Install from uv.lock rather than from the built sdist's metadata: phenome is a
# workspace member and stedfm is a git dependency, and neither can be resolved
# from a package registry. Only `uv sync` reads [tool.uv.sources].
runner = uv-venv-lock-runner
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITLAB_CI
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
dependency_groups =
    dev
commands = pytest -v --color=yes --cov=phenome_gui --cov-report=xml --cov-report=term-missing {posargs}
